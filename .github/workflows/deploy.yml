name: Deploy to Amazon S3

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create .env file (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          cat > .env << EOF
          REACT_APP_API_URL=${{ secrets.PRODUCTION_API_URL }}
          REACT_APP_ENV=production
          REACT_APP_S3_BUCKET=${{ secrets.PRODUCTION_S3_BUCKET }}
          REACT_APP_PRODUCTION_APP_URL=${{ secrets.PRODUCTION_APP_URL }}
          REACT_APP_PRODUCTION_COGNITO_USER_POOL_ID=${{ secrets.PRODUCTION_COGNITO_USER_POOL_ID }}
          REACT_APP_PRODUCTION_COGNITO_CLIENT_ID=${{ secrets.PRODUCTION_COGNITO_CLIENT_ID }}
          REACT_APP_PRODUCTION_COGNITO_DOMAIN=${{ secrets.PRODUCTION_COGNITO_DOMAIN }}
          REACT_APP_PRODUCTION_GOOGLE_CLIENT_ID=${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
          REACT_APP_PRODUCTION_APPLE_CLIENT_ID=${{ secrets.PRODUCTION_APPLE_CLIENT_ID }}
          REACT_APP_STRIPE_PRICE_MONTHLY_PRODUCTION=${{ secrets.STRIPE_PRICE_MONTHLY_PRODUCTION }}
          EOF

      - name: Create .env file (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          cat > .env << EOF
          REACT_APP_API_URL=${{ secrets.STAGING_API_URL }}
          REACT_APP_ENV=staging
          REACT_APP_S3_BUCKET=${{ secrets.STAGING_S3_BUCKET }}
          REACT_APP_STAGING_APP_URL=${{ secrets.STAGING_APP_URL }}
          REACT_APP_STAGING_COGNITO_USER_POOL_ID=${{ secrets.STAGING_COGNITO_USER_POOL_ID }}
          REACT_APP_STAGING_COGNITO_CLIENT_ID=${{ secrets.STAGING_COGNITO_CLIENT_ID }}
          REACT_APP_STAGING_COGNITO_DOMAIN=${{ secrets.STAGING_COGNITO_DOMAIN }}
          REACT_APP_STAGING_GOOGLE_CLIENT_ID=${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
          REACT_APP_STAGING_APPLE_CLIENT_ID=${{ secrets.STAGING_APPLE_CLIENT_ID }}
          REACT_APP_STRIPE_PRICE_MONTHLY_STAGING=${{ secrets.STRIPE_PRICE_MONTHLY_STAGING }}
          EOF

      - name: Debug - Show .env contents
        run: |
          echo "=== .env file contents ==="
          cat .env
          echo ""
          echo "=== Check for empty values ==="
          grep -E "^REACT_APP_STAGING.*=$" .env && echo "❌ Found empty staging vars!" || echo "✅ All staging vars have values"

      - name: Verify .env exists (env is baked into build – no .env on S3)
        run: |
          if [ ! -f .env ]; then echo "::error::No .env created. Check that workflow ran for main or staging."; exit 1; fi
          echo "REACT_APP_ENV is set. Add GitHub Secrets if any REACT_APP_* values are empty."

      - name: Build React App
        run: npm install --legacy-peer-deps && npm run build

      # NOTE: index.html and asset-manifest.json are the SPA entry files. They must
      # be re-published every deploy and never cached, or the browser keeps loading
      # the previous hashed bundle. Plain `s3 sync` was leaving a stale index.html
      # at the origin, so we `cp` them explicitly with no-cache and invalidate CloudFront.

      - name: Deploy to Production S3
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 sync ./build/ s3://app.meksova.com --exclude index.html --exclude asset-manifest.json
          aws s3 cp ./build/index.html s3://app.meksova.com/index.html \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
          aws s3 cp ./build/asset-manifest.json s3://app.meksova.com/asset-manifest.json \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "application/json"

      - name: Invalidate Production CloudFront
        if: github.ref == 'refs/heads/main'
        env:
          DIST: ${{ secrets.PRODUCTION_CF_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DIST" ]; then echo "::warning::PRODUCTION_CF_DISTRIBUTION_ID secret not set — skipping invalidation (index.html is no-cache, but set the secret to purge instantly)"; exit 0; fi
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      - name: Deploy to Staging S3
        if: github.ref == 'refs/heads/staging'
        run: |
          aws s3 sync ./build/ s3://staging.meksova.com --exclude index.html --exclude asset-manifest.json
          aws s3 cp ./build/index.html s3://staging.meksova.com/index.html \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
          aws s3 cp ./build/asset-manifest.json s3://staging.meksova.com/asset-manifest.json \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "application/json"

      - name: Invalidate Staging CloudFront
        if: github.ref == 'refs/heads/staging'
        env:
          DIST: ${{ secrets.STAGING_CF_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DIST" ]; then echo "::warning::STAGING_CF_DISTRIBUTION_ID secret not set — skipping invalidation (index.html is no-cache, but set the secret to purge instantly)"; exit 0; fi
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
